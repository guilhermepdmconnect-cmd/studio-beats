<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Beats</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
:root{--bg:#080810;--bg2:#0e0e1a;--bg3:#13131f;--border:#1e1e2e;--border2:#2a2a3e;--text:#e8e8f0;--text2:#8888aa;--text3:#44445a;--accent:#7c6ff7;--accent2:#a89cf7;--accent-bg:#1a1830;--success:#4ade80;--success-bg:#0d2a1a;--warning:#fbbf24;--warning-bg:#2a1f0a;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--radius:10px;--radius-sm:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
body.light{--bg:#f4f4f8;--bg2:#ffffff;--bg3:#eeeef4;--border:#e0e0ec;--border2:#ccccdd;--text:#1a1a2e;--text2:#555577;--text3:#9999bb;--accent-bg:#ededff}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:radial-gradient(ellipse at 20% 50%,#1a1535 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#0d1a35 0%,transparent 50%)}
body.light .auth-screen{background-image:radial-gradient(ellipse at 20% 50%,#e8e4ff 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#e0eaff 0%,transparent 50%)}
.auth-card{width:380px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2.5rem}
.auth-logo{text-align:center;margin-bottom:2rem}
.auth-logo-eye{font-size:10px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
.auth-logo-name{font-size:22px;font-weight:600;color:var(--text)}
.auth-logo-name span{color:var(--accent2)}
.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.auth-btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);margin-top:.5rem;transition:opacity .15s}
.auth-btn:hover{opacity:.88}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-switch{font-size:12px;color:var(--text3);text-align:center;margin-top:1rem}
.auth-switch a{color:var(--accent2);cursor:pointer}
.auth-error{font-size:12px;color:#f87171;background:#2a0f0f;border:1px solid #5a1f1f;border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:1rem;display:none}
.auth-success{font-size:12px;color:var(--success);background:var(--success-bg);border:1px solid #1a5a30;border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:1rem;display:none}
.app{display:flex;min-height:100vh}
.sidebar{width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:20;transition:transform .25s}
.logo-area{padding:22px 18px 18px;border-bottom:1px solid var(--border)}
.logo-eye{font-size:9px;letter-spacing:2.5px;color:var(--text3);text-transform:uppercase;margin-bottom:4px}
.logo-name{font-size:16px;font-weight:600;color:var(--text)}
.logo-name span{color:var(--accent2)}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav-section{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;padding:0 8px;margin:14px 0 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);transition:all .12s;margin-bottom:1px;font-size:13px}
.nav-item i{font-size:16px;flex-shrink:0}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent2);font-weight:500}
.nav-badge{margin-left:auto;font-size:10px;background:var(--bg3);color:var(--text3);padding:2px 7px;border-radius:20px;font-family:var(--mono)}
.nav-item.active .nav-badge{background:var(--bg)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.user-name{font-size:12px;color:var(--text);font-weight:500}
.user-role{font-size:10px;color:var(--text3);margin-top:1px}
.logout-btn{margin-left:auto;background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;transition:color .12s;padding:2px}
.logout-btn:hover{color:var(--text)}
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;min-width:0;padding-bottom:80px}
.topbar{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;gap:12px}
.topbar-left{display:flex;align-items:center;gap:12px}
.hamburger{display:none;background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px}
.page-title{font-size:17px;font-weight:600;color:var(--text)}
.page-sub{font-size:11px;color:var(--text3);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-family:var(--font);font-weight:500;transition:all .12s}
.btn:hover{background:var(--bg3)}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent}
.btn-primary:hover{opacity:.88}
.btn-danger{background:#2a0f0f;color:#f87171;border-color:#5a1f1f}
.btn-danger:hover{background:#3a1515}
.btn-success{background:var(--success-bg);color:var(--success);border-color:#1a5a30}
.btn-icon{padding:7px;border-radius:var(--radius-sm)}
.content{padding:20px 24px 32px;flex:1}
.filter-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.filter-rows{display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.frow-label{font-size:10px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;width:50px;flex-shrink:0;font-family:var(--mono)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:4px 11px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:var(--font);transition:all .12s;white-space:nowrap}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2);font-weight:500}
.filter-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.filter-count{font-size:11px;color:var(--text3)}
.filter-count b{color:var(--text2)}
.clear-filters{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:var(--font)}
.clear-filters:hover{color:var(--text)}
.results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.results-count{font-size:11px;color:var(--text3);font-family:var(--mono)}
.results-count b{color:var(--text2)}
.sort-sel{font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);padding:5px 9px;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font);outline:none}
.beats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.beat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .15s;position:relative}
.beat-card:hover{border-color:var(--border2)}
.beat-card.playing{border-color:var(--accent)}
.beat-card.playing::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:1}
.beat-card.exclusive::after{content:'🔒';position:absolute;top:8px;right:8px;font-size:12px;z-index:2}
.beat-card.archived{opacity:.5}
.beat-cover{width:100%;height:110px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:28px;overflow:hidden}
.beat-cover img{width:100%;height:100%;object-fit:cover}
.beat-body{padding:11px}
.wave{height:26px;display:flex;align-items:center;gap:1.5px;margin-bottom:9px}
.wb{border-radius:2px;flex:1}
.beat-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.beat-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.tag{font-size:9px;font-weight:500;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:0.3px;font-family:var(--mono)}
.t-bpm{background:var(--accent-bg);color:var(--accent2)}
.t-style{background:var(--bg3);color:var(--text2)}
.t-scale{background:var(--success-bg);color:var(--success)}
.t-mood{background:var(--warning-bg);color:var(--warning)}
.t-excl{background:#2a1a0a;color:#f0a060}
.t-arch{background:var(--bg3);color:var(--text3)}
.beat-footer{display:flex;align-items:center;justify-content:space-between}
.play-btn{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;color:#fff;font-size:11px;transition:opacity .12s;flex-shrink:0}
.play-btn:hover{opacity:.8}
.beat-actions{display:flex;align-items:center;gap:3px}
.icon-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;transition:color .12s;padding:3px;border-radius:4px}
.icon-btn:hover{color:var(--text);background:var(--bg3)}
.icon-btn.fav.on{color:#f87171}
.icon-btn.danger:hover{color:#f87171}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text3);grid-column:1/-1}
.empty-state i{font-size:36px;display:block;margin-bottom:8px}
.empty-state p{font-size:13px}
.empty-state small{font-size:11px;margin-top:4px;display:block}
.player-bar{position:fixed;bottom:0;left:210px;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:16px;z-index:15}
.player-info{display:flex;align-items:center;gap:10px;min-width:160px}
.player-cover{width:36px;height:36px;border-radius:6px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:16px}
.player-cover img{width:100%;height:100%;object-fit:cover}
.player-txt{display:flex;flex-direction:column}
.player-name{font-size:13px;font-weight:500;color:var(--text)}
.player-meta{font-size:11px;color:var(--text3);margin-top:1px}
.player-controls{display:flex;align-items:center;flex:1;justify-content:center;flex-direction:column;gap:5px}
.player-btns{display:flex;align-items:center;gap:12px}
.p-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;transition:color .12s;padding:2px;font-family:var(--font)}
.p-btn:hover{color:var(--text)}
.p-btn.main-btn{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.p-btn.main-btn:hover{opacity:.85}
.progress-wrap{display:flex;align-items:center;gap:8px;width:100%;max-width:400px}
.progress-time{font-size:10px;color:var(--text3);font-family:var(--mono);width:32px}
.progress-time.right{text-align:right}
.progress-bar{flex:1;height:3px;background:var(--border2);border-radius:2px;cursor:pointer}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;width:0%}
.player-vol{display:flex;align-items:center;gap:6px;min-width:100px}
.vol-slider{width:70px;accent-color:var(--accent);cursor:pointer}
.upload-wrap{max-width:540px}
.upload-zone{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:2rem;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:16px}
.upload-zone:hover{border-color:var(--accent);background:var(--accent-bg)}
.upload-zone.has-file{border-color:var(--success);background:var(--success-bg)}
.upload-zone i{font-size:26px;color:var(--text2);display:block;margin-bottom:8px}
.upload-zone.has-file i{color:var(--success)}
.upload-txt{font-size:13px;color:var(--text2)}
.upload-sub{font-size:11px;color:var(--text3);margin-top:3px}
.cover-upload{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:1rem;text-align:center;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px}
.cover-upload:hover{border-color:var(--accent)}
.cover-preview{width:56px;height:56px;border-radius:8px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:22px}
.cover-preview img{width:100%;height:100%;object-fit:cover}
.form-section{margin-bottom:18px}
.form-section-title{font-size:10px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);font-family:var(--mono)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11px;color:var(--text2)}
.form-input{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s;width:100%}
.form-input:focus{border-color:var(--accent)}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mood-opt{padding:9px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;cursor:pointer;font-size:12px;color:var(--text2);font-family:var(--font);text-align:center;transition:all .12s}
.mood-opt:hover{background:var(--bg3);border-color:var(--border2);color:var(--text)}
.mood-opt.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2);font-weight:500}
.form-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.progress-upload{display:none;margin-bottom:14px;padding:10px 14px;background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--radius-sm);font-size:12px;color:var(--accent2);align-items:center;gap:8px}
/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.dash-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.dash-icon{font-size:22px;margin-bottom:8px}
.dash-value{font-size:26px;font-weight:600;color:var(--text);font-family:var(--mono)}
.dash-label{font-size:11px;color:var(--text3);margin-top:3px}
.activity-list{display:flex;flex-direction:column;gap:8px}
.activity-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.activity-icon{font-size:18px;flex-shrink:0}
.activity-txt{font-size:13px;color:var(--text)}
.activity-txt span{color:var(--accent2);font-weight:500}
.activity-time{font-size:10px;color:var(--text3);margin-left:auto;font-family:var(--mono);white-space:nowrap}
/* BEAT DETAIL */
.beat-detail-header{display:flex;gap:20px;margin-bottom:24px;align-items:flex-start}
.beat-detail-cover{width:120px;height:120px;border-radius:12px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:40px}
.beat-detail-cover img{width:100%;height:100%;object-fit:cover}
.beat-detail-info{flex:1}
.beat-detail-name{font-size:20px;font-weight:600;color:var(--text);margin-bottom:8px}
.beat-detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.beat-detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.section-title{font-size:11px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);font-family:var(--mono)}
.comments-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:200px;overflow-y:auto}
.comment-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px}
.comment-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.comment-author{font-size:12px;font-weight:500;color:var(--accent2)}
.comment-author.master{color:var(--warning)}
.comment-date{font-size:10px;color:var(--text3);font-family:var(--mono)}
.comment-text{font-size:13px;color:var(--text2);line-height:1.5}
.comment-input-wrap{display:flex;gap:8px}
.comment-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;resize:none;transition:border-color .15s}
.comment-input:focus{border-color:var(--accent)}
.lyrics-area{width:100%;min-height:180px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:13px;color:var(--text);font-family:var(--mono);outline:none;resize:vertical;line-height:1.7;transition:border-color .15s}
.lyrics-area:focus{border-color:var(--accent)}
/* MEMBERS / SETTINGS */
.members-list{display:flex;flex-direction:column;gap:8px;max-width:560px}
.member-card{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;gap:10px}
.member-info{display:flex;align-items:center;gap:12px;min-width:0}
.member-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.member-name{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-role-txt{font-size:11px;color:var(--text3);margin-top:1px}
.member-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.status-badge{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:500;white-space:nowrap}
.status-produtor{background:var(--accent-bg);color:var(--accent2)}
.status-artista{background:var(--success-bg);color:var(--success)}
.status-master{background:var(--warning-bg);color:var(--warning)}
.status-inactive{background:#2a0f0f;color:#f87171}
.role-select{font-size:11px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:4px 8px;border-radius:var(--radius-sm);font-family:var(--font);outline:none;cursor:pointer}
/* ANNOUNCEMENTS */
.ann-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.ann-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.ann-content{font-size:13px;color:var(--text2);line-height:1.6}
.ann-date{font-size:10px;color:var(--text3);margin-top:8px;font-family:var(--mono)}
/* ALBUMS */
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.album-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .15s}
.album-card:hover{border-color:var(--border2)}
.album-card.active{border-color:var(--accent);background:var(--accent-bg)}
.album-name{font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px}
.album-count{font-size:11px;color:var(--text3)}
/* LYRICS VIEW */
.lyrics-view-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.lyrics-view-author{font-size:12px;color:var(--accent2);font-weight:500;margin-bottom:8px}
.lyrics-view-content{font-size:13px;color:var(--text2);line-height:1.8;white-space:pre-wrap;font-family:var(--mono)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;padding:16px}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:2rem;width:100%;max-width:520px;transform:translateY(12px);transition:transform .2s;max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-title{font-size:15px;font-weight:600;margin-bottom:6px}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:1.5rem}
.modal-actions{display:flex;gap:8px;margin-top:1.5rem;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:90px;right:24px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;font-size:13px;color:var(--text);z-index:200;display:flex;align-items:center;gap:8px;transform:translateY(30px);opacity:0;transition:all .25s;max-width:300px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:#1a5a30}
.toast.error{border-color:#5a1f1f}
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:12px}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--text3)}
.hidden{display:none!important}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}
.divider-section{display:flex;align-items:center;gap:10px;margin:24px 0 14px}
.divider-section span{font-size:11px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;font-family:var(--mono);white-space:nowrap}
.divider-section::before,.divider-section::after{content:'';flex:1;height:1px;background:var(--border)}
@media(max-width:700px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .main{margin-left:0}
  .player-bar{left:0;flex-wrap:wrap;padding:8px 14px}
  .player-vol{display:none}
  .hamburger{display:block}
  .beats-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .form-grid{grid-template-columns:1fr}
  .beat-detail-header{flex-direction:column}
  .beat-detail-cover{width:100%;height:160px}
  .content{padding:14px 14px 24px}
  .topbar{padding:10px 14px}
  .modal{padding:1.25rem}
  .dash-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="loading-overlay" id="loading"><div class="spinner"></div><div class="loading-txt" id="loading-txt">Iniciando...</div></div>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="auth" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-logo"><div class="auth-logo-eye">Gravadora</div><div class="auth-logo-name">Studio <span>Beats</span></div></div>
    <div id="auth-error" class="auth-error"></div>
    <div id="auth-success" class="auth-success"></div>
    <div id="view-login">
      <div class="field"><label>E-mail</label><input id="login-email" type="email" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')login()"/></div>
      <div class="field"><label>Senha</label><input id="login-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/></div>
      <button class="auth-btn" id="login-btn" onclick="login()">Entrar</button>
      <div class="auth-switch">Não tem conta? <a onclick="showView('register')">Cadastre-se</a></div>
    </div>
    <div id="view-register" class="hidden">
      <div class="field"><label>Nome</label><input id="reg-name" type="text" placeholder="Seu nome artístico"/></div>
      <div class="field"><label>E-mail</label><input id="reg-email" type="email" placeholder="seu@email.com"/></div>
      <div class="field"><label>Senha</label><input id="reg-pass" type="password" placeholder="Mínimo 6 caracteres"/></div>
      <button class="auth-btn" id="reg-btn" onclick="register()">Criar conta</button>
      <div class="auth-switch">Já tem conta? <a onclick="showView('login')">Entrar</a></div>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="sidebar" id="sidebar">
    <div class="logo-area"><div class="logo-eye">Gravadora</div><div class="logo-name">Studio <span>Beats</span></div></div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-footer">
      <div class="user-pill">
        <div class="user-avatar" id="user-av">?</div>
        <div><div class="user-name" id="user-nm">...</div><div class="user-role" id="user-rl">...</div></div>
        <button class="logout-btn" onclick="logout()" title="Sair"><i class="ti ti-logout"></i></button>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
  <div class="player-bar hidden" id="player-bar">
    <div class="player-info">
      <div class="player-cover" id="p-cover"><i class="ti ti-music"></i></div>
      <div class="player-txt"><div class="player-name" id="p-name">—</div><div class="player-meta" id="p-meta">—</div></div>
    </div>
    <div class="player-controls">
      <div class="player-btns">
        <button class="p-btn" onclick="seekRel(-10)"><i class="ti ti-player-skip-back"></i></button>
        <button class="p-btn main-btn" id="p-playbtn" onclick="toggleAudio()"><i class="ti ti-player-play"></i></button>
        <button class="p-btn" onclick="seekRel(10)"><i class="ti ti-player-skip-forward"></i></button>
      </div>
      <div class="progress-wrap">
        <span class="progress-time" id="p-cur">0:00</span>
        <div class="progress-bar" id="p-bar" onclick="seekClick(event)"><div class="progress-fill" id="p-fill"></div></div>
        <span class="progress-time right" id="p-dur">0:00</span>
      </div>
    </div>
    <div class="player-vol">
      <i class="ti ti-volume" style="color:var(--text3);font-size:16px"></i>
      <input type="range" class="vol-slider" min="0" max="1" step="0.05" value="1" oninput="setVol(this.value)"/>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<audio id="audio-el" preload="none"></audio>

<script>
const SB_URL='https://ltweognlkyrenhavfnoz.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0d2VvZ25sa3lyZW5oYXZmbm96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NzMwNzgsImV4cCI6MjA5NDM0OTA3OH0.GBlPlGWA9Q9BWpjE_2OAiRDejE_-KKvuiyFLhOC0D-E';
const STYLES=['Trap','R&B','Drill','Soul','Funk','Lo-fi','Pop','Sertanejo'];
const SCALES=['Dó maior','Ré menor','Mi menor','Fá maior','Sol maior','Lá menor','Lá maior','Si menor','Mi maior','Sol menor'];
const MOODS=['Feliz','Triste','Melancólico','Neutro','Agitado','Intenso'];
const BPMS=['Lento (60–90)','Médio (90–120)','Rápido (120–150)','Muito rápido (150+)'];

let beats=[],profiles=[],favorites=new Set(),albums=[],announcements=[],activities=[],beatAccess={};
const SEL={style:new Set(),mood:new Set(),bpm:new Set()};
let currentUser=null,currentProfile=null,currentPage='',playingId=null;
let selectedFile=null,selectedCover=null,selectedMood='',accessToken=null;
let lightMode=localStorage.getItem('light')==='1';
let editingBeat=null,selectedAlbum=null;

async function sb(path,opts={}){
  const h={'apikey':SB_KEY,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})};
  if(accessToken)h['Authorization']='Bearer '+accessToken;
  else h['Authorization']='Bearer '+SB_KEY;
  const r=await fetch(SB_URL+path,{...opts,headers:h});
  const t=await r.text();
  if(!r.ok)throw new Error(t);
  return t?JSON.parse(t):[];
}
async function sbAuth(path,body){
  const r=await fetch(SB_URL+'/auth/v1'+path,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.msg||'Erro');
  return d;
}
async function uploadFile(file,bucket){
  const ext=file.name.split('.').pop();
  const path=Date.now()+'.'+ext;
  const r=await fetch(`${SB_URL}/storage/v1/object/${bucket}/${path}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+accessToken,'Content-Type':file.type},body:file});
  if(!r.ok)throw new Error('Erro no upload');
  return `${SB_URL}/storage/v1/object/public/${bucket}/${path}`;
}
async function logActivity(type,beatId,beatName){
  try{await sb('/rest/v1/activities',{method:'POST',body:JSON.stringify({user_id:currentUser.id,user_name:currentProfile.name,type,beat_id:beatId||null,beat_name:beatName||null})});}catch(e){}
}

function applyTheme(){document.body.classList.toggle('light',lightMode);}
function toggleTheme(){lightMode=!lightMode;localStorage.setItem('light',lightMode?'1':'0');applyTheme();renderTopbar();}
applyTheme();

function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebar-overlay').classList.add('open');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-overlay').classList.remove('open');}

function showView(v){document.getElementById('view-login').classList.toggle('hidden',v!=='login');document.getElementById('view-register').classList.toggle('hidden',v!=='register');clearAuthMsg();}
function clearAuthMsg(){document.getElementById('auth-error').style.display='none';document.getElementById('auth-success').style.display='none';}
function showAuthError(msg){const e=document.getElementById('auth-error');e.textContent=msg;e.style.display='block';document.getElementById('auth-success').style.display='none';}
function showAuthSuccess(msg){const e=document.getElementById('auth-success');e.textContent=msg;e.style.display='block';document.getElementById('auth-error').style.display='none';}

async function login(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!email||!pass){showAuthError('Preencha e-mail e senha.');return;}
  const btn=document.getElementById('login-btn');btn.disabled=true;btn.textContent='Entrando...';clearAuthMsg();
  try{
    const d=await sbAuth('/token?grant_type=password',{email,password:pass});
    accessToken=d.access_token;currentUser=d.user;
    localStorage.setItem('sb_token',d.access_token);localStorage.setItem('sb_refresh',d.refresh_token);
    await loadProfile();await initApp();
  }catch(e){showAuthError('E-mail ou senha incorretos.');}
  btn.disabled=false;btn.textContent='Entrar';
}

async function register(){
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const pass=document.getElementById('reg-pass').value;
  if(!name){showAuthError('Informe seu nome.');return;}
  if(!email){showAuthError('Informe seu e-mail.');return;}
  if(pass.length<6){showAuthError('Senha mínimo 6 caracteres.');return;}
  const btn=document.getElementById('reg-btn');btn.disabled=true;btn.textContent='Criando...';clearAuthMsg();
  try{
    const d=await sbAuth('/signup',{email,password:pass,data:{name}});
    if(d.access_token){
      accessToken=d.access_token;currentUser=d.user;
      localStorage.setItem('sb_token',d.access_token);localStorage.setItem('sb_refresh',d.refresh_token);
      await loadProfile();await initApp();
    }else{showAuthSuccess('Conta criada! Faça login.');showView('login');document.getElementById('login-email').value=email;}
  }catch(e){showAuthError(e.message||'Erro ao criar conta.');}
  btn.disabled=false;btn.textContent='Criar conta';
}

async function loadProfile(){
  try{const r=await sb(`/rest/v1/profiles?id=eq.${currentUser.id}`);currentProfile=r[0]||{name:currentUser.email,role:'artista',active:true};}
  catch(e){currentProfile={name:currentUser.email,role:'artista',active:true};}
}
async function logout(){
  try{await sbAuth('/logout',{});}catch(e){}
  stopAudio();accessToken=null;currentUser=null;currentProfile=null;
  localStorage.removeItem('sb_token');localStorage.removeItem('sb_refresh');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');showView('login');
}
async function initApp(){
  showLoading('Carregando...');
  await loadBeats();await loadFavorites();
  if(isMaster()){await loadProfiles();await loadActivities();await loadAnnouncements();}
  else if(isProdutor()){await loadProfiles();}
  else{await loadAnnouncements();}
  await loadAlbums();
  await loadBeatAccess();
  hideLoading();
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const ini=currentProfile.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('user-av').textContent=ini;
  document.getElementById('user-nm').textContent=currentProfile.name;
  document.getElementById('user-rl').textContent=isMaster()?'👑 Produtor Mestre':isProdutor()?'Produtor':'Artista';
  goTo(isMaster()?'dashboard':'beats');
}
function isProdutor(){return currentProfile&&(currentProfile.role==='produtor'||currentProfile.role==='master');}
function isMaster(){return currentProfile&&currentProfile.role==='master';}

async function loadBeats(){try{beats=await sb('/rest/v1/beats?order=created_at.desc');}catch(e){beats=[];}}
async function loadProfiles(){try{profiles=await sb('/rest/v1/profiles?order=created_at.asc');}catch(e){profiles=[];}}
async function loadFavorites(){try{const r=await sb(`/rest/v1/favorites?user_id=eq.${currentUser.id}&select=beat_id`);favorites=new Set(r.map(x=>x.beat_id));}catch(e){favorites=new Set();}}
async function loadActivities(){try{activities=await sb('/rest/v1/activities?order=created_at.desc&limit=30');}catch(e){activities=[];}}
async function loadAnnouncements(){try{announcements=await sb('/rest/v1/announcements?order=created_at.desc');}catch(e){announcements=[];}}
async function loadAlbums(){try{albums=await sb('/rest/v1/albums?order=created_at.asc');}catch(e){albums=[];}}
async function loadBeatAccess(){
  try{
    const r=await sb('/rest/v1/beat_access?select=beat_id,user_id');
    beatAccess={};
    r.forEach(x=>{
      if(!beatAccess[x.beat_id])beatAccess[x.beat_id]=[];
      beatAccess[x.beat_id].push(x.user_id);
    });
  }catch(e){beatAccess={};}
}

async function loadComments(beatId){try{return await sb(`/rest/v1/comments?beat_id=eq.${beatId}&order=created_at.asc`);}catch(e){return[];}}
async function loadLyrics(beatId){try{const r=await sb(`/rest/v1/lyrics?beat_id=eq.${beatId}&user_id=eq.${currentUser.id}`);return r[0]||null;}catch(e){return null;}}
async function loadAllLyrics(beatId){try{return await sb(`/rest/v1/lyrics?beat_id=eq.${beatId}&order=created_at.asc`);}catch(e){return[];}}

function showLoading(msg){document.getElementById('loading-txt').textContent=msg||'...';document.getElementById('loading').classList.remove('hidden');}
function hideLoading(){document.getElementById('loading').classList.add('hidden');}

function navItems(){
  if(isMaster())return[
    {section:'Painel'},
    {id:'dashboard',icon:'ti-layout-dashboard',label:'Dashboard',badge:null},
    {id:'activity',icon:'ti-activity',label:'Atividades',badge:activities.length||null},
    {section:'Biblioteca'},
    {id:'beats',icon:'ti-music',label:'Beats',badge:beats.length},
    {id:'albums',icon:'ti-folder-music',label:'Álbuns',badge:albums.length||null},
    {id:'upload',icon:'ti-cloud-upload',label:'Novo beat',badge:null},
    {section:'Equipe'},
    {id:'members',icon:'ti-users',label:'Membros',badge:profiles.length},
    {id:'lyrics-view',icon:'ti-file-text',label:'Letras',badge:null},
    {id:'announce',icon:'ti-speakerphone',label:'Avisos',badge:null},
    {section:'Sistema'},
    {id:'settings',icon:'ti-settings',label:'Config.',badge:null},
  ];
  if(isProdutor())return[
    {id:'beats',icon:'ti-music',label:'Beats',badge:beats.length},
    {id:'albums',icon:'ti-folder-music',label:'Álbuns',badge:albums.length||null},
    {id:'upload',icon:'ti-cloud-upload',label:'Novo beat',badge:null},
    {id:'members',icon:'ti-users',label:'Membros',badge:profiles.length},
  ];
  return[
    {id:'beats',icon:'ti-music',label:'Explorar beats',badge:beats.length},
    {id:'announce',icon:'ti-speakerphone',label:'Avisos',badge:announcements.length||null},
  ];
}
function renderNav(){
  document.getElementById('nav').innerHTML=navItems().map(p=>{
    if(p.section)return`<div class="nav-section">${p.section}</div>`;
    return`<div class="nav-item${currentPage===p.id?' active':''}" onclick="goTo('${p.id}');closeSidebar()">
      <i class="ti ${p.icon}"></i>${p.label}
      ${p.badge!=null?`<span class="nav-badge">${p.badge}</span>`:''}
    </div>`;
  }).join('');
}
function goTo(p){currentPage=p;renderNav();renderTopbar();renderContent();}

function renderTopbar(){
  const T={dashboard:'Dashboard',activity:'Atividades',beats:'Biblioteca de Beats',albums:'Álbuns',upload:'Novo Beat',members:'Membros',settings:'Configurações',announce:'Avisos',lyrics_view:'Letras dos Artistas'};
  const S={dashboard:'Visão geral da gravadora',activity:'Últimas ações na plataforma',beats:'Gerencie os beats',albums:'Organize beats em pastas',upload:'Adicione um novo beat',members:'Artistas cadastrados',settings:'Papéis e acessos',announce:'Comunicados da gravadora',lyrics_view:'Letras escritas pelos artistas'};
  const isP=isProdutor();
  const btn=currentPage==='beats'&&isP?`<button class="btn btn-primary" onclick="goTo('upload')"><i class="ti ti-plus"></i>Novo beat</button>`:
    currentPage==='announce'&&isMaster()?`<button class="btn btn-primary" onclick="showAddAnnounce()"><i class="ti ti-plus"></i>Novo aviso</button>`:
    currentPage==='albums'&&isMaster()?`<button class="btn btn-primary" onclick="showAddAlbum()"><i class="ti ti-plus"></i>Novo álbum</button>`:
    !['beats','dashboard','activity','announce'].includes(currentPage)?`<button class="btn" onclick="goTo('beats')"><i class="ti ti-arrow-left"></i>Voltar</button>`:'';
  const themeBtn=`<button class="btn btn-icon" onclick="toggleTheme()" title="Tema"><i class="ti ${lightMode?'ti-moon':'ti-sun'}"></i></button>`;
  document.getElementById('topbar').innerHTML=`
    <div class="topbar-left">
      <button class="hamburger" onclick="openSidebar()"><i class="ti ti-menu-2"></i></button>
      <div><div class="page-title">${T[currentPage]||'Studio Beats'}</div><div class="page-sub">${S[currentPage]||''}</div></div>
    </div>
    <div class="topbar-right">${themeBtn}${btn}</div>`;
}

function renderContent(){
  const el=document.getElementById('content');
  if(currentPage==='dashboard')el.innerHTML=dashboardHTML();
  else if(currentPage==='activity')el.innerHTML=activityHTML();
  else if(currentPage==='beats')el.innerHTML=beatsHTML();
  else if(currentPage==='albums')el.innerHTML=albumsHTML();
  else if(currentPage==='upload'){el.innerHTML=uploadHTML();bindUpload();}
  else if(currentPage==='members')el.innerHTML=membersHTML();
  else if(currentPage==='settings')el.innerHTML=settingsHTML();
  else if(currentPage==='announce')el.innerHTML=announceHTML();
  else if(currentPage==='lyrics-view')el.innerHTML=lyricsViewHTML();
}

// ── DASHBOARD ──────────────────────────────────────────
function dashboardHTML(){
  const activeArtists=profiles.filter(p=>p.role==='artista'&&p.active!==false).length;
  const recentBeats=beats.filter(b=>!b.archived).length;
  const topFavBeat=beats.reduce((a,b)=>(b.fav_count||0)>(a.fav_count||0)?b:a,beats[0]);
  const recentActs=activities.slice(0,5);
  const actHTML=recentActs.length===0?`<div class="empty-state" style="padding:1rem"><p>Nenhuma atividade ainda</p></div>`
    :recentActs.map(a=>actItemHTML(a)).join('');
  const annHTML=announcements.length===0?`<div class="empty-state" style="padding:1rem"><p>Nenhum aviso publicado</p></div>`
    :announcements.slice(0,2).map(a=>`<div class="ann-card"><div class="ann-title">${a.title}</div><div class="ann-content">${a.content}</div><div class="ann-date">${new Date(a.created_at).toLocaleDateString('pt-BR')}</div></div>`).join('');
  return`<div class="dash-grid">
    <div class="dash-card"><div class="dash-icon">🎵</div><div class="dash-value">${recentBeats}</div><div class="dash-label">Beats ativos</div></div>
    <div class="dash-card"><div class="dash-icon">👥</div><div class="dash-value">${activeArtists}</div><div class="dash-label">Artistas ativos</div></div>
    <div class="dash-card"><div class="dash-icon">📁</div><div class="dash-value">${albums.length}</div><div class="dash-label">Álbuns</div></div>
    <div class="dash-card"><div class="dash-icon">📢</div><div class="dash-value">${announcements.length}</div><div class="dash-label">Avisos publicados</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;flex-wrap:wrap">
    <div>
      <div class="section-title">Últimas atividades</div>
      <div class="activity-list">${actHTML}</div>
      ${activities.length>5?`<button class="btn" style="margin-top:10px;width:100%" onclick="goTo('activity')">Ver todas</button>`:''}
    </div>
    <div>
      <div class="section-title">Últimos avisos</div>
      ${annHTML}
      <button class="btn" style="margin-top:10px;width:100%" onclick="goTo('announce')">Ver todos</button>
    </div>
  </div>`;
}

function actItemHTML(a){
  const icons={favorite:'❤️',download:'⬇️',comment:'💬',login:'👤',beat_added:'🎵',lyrics:'📝'};
  const labels={favorite:'favoritou',download:'baixou',comment:'comentou em',login:'entrou na plataforma',beat_added:'adicionou o beat',lyrics:'escreveu letra em'};
  return`<div class="activity-item">
    <span class="activity-icon">${icons[a.type]||'📌'}</span>
    <span class="activity-txt"><span>${a.user_name}</span> ${labels[a.type]||a.type}${a.beat_name?' "'+a.beat_name+'"':''}</span>

function activityHTML(){

function timeAgo(d){
  const s=Math.floor((Date.now()-new Date(d))/1000);
  if(s<60)return'agora';if(s<3600)return Math.floor(s/60)+'min';
  if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';
}

// ── BEATS PAGE ─────────────────────────────────────────
function inBpm(bpm,r){if(r==='Lento (60–90)')return bpm>=60&&bpm<90;if(r==='Médio (90–120)')return bpm>=90&&bpm<120;if(r==='Rápido (120–150)')return bpm>=120&&bpm<150;if(r==='Muito rápido (150+)')return bpm>=150;return true;}
function canSeeBeat(b){
  if(!b.exclusive)return true;
  if(isProdutor())return true;
  const allowed=beatAccess[b.id]||[];
  return allowed.includes(currentUser.id);
}
function getFiltered(){return beats.filter(b=>!b.archived&&canSeeBeat(b)&&(SEL.style.size===0||SEL.style.has(b.style))&&(SEL.mood.size===0||SEL.mood.has(b.mood))&&(SEL.bpm.size===0||[...SEL.bpm].some(r=>inBpm(b.bpm,r))));}  
function waveHTML(on){const h=[12,22,32,18,36,26,42,16,30,22,36,14,28,22,42,18,32,24];return h.map((v,i)=>{const bg=on?(i%3===0?'var(--accent)':'var(--accent-bg)'):'var(--border)';return`<div class="wb" style="height:${v}px;background:${bg}"></div>`;}).join('');}
function toggleChip(type,val){SEL[type].has(val)?SEL[type].delete(val):SEL[type].add(val);document.getElementById('content').innerHTML=beatsHTML();}
function clearFilters(){SEL.style.clear();SEL.mood.clear();SEL.bpm.clear();goTo('beats');}
function totalSel(){return SEL.style.size+SEL.mood.size+SEL.bpm.size;}

function beatCardHTML(b){
  const isFav=favorites.has(b.id);const isP=isProdutor();
  const coverHTML=b.cover_url?`<div class="beat-cover"><img src="${b.cover_url}" alt="capa"/></div>`:`<div class="beat-cover"><i class="ti ti-music"></i></div>`;
  const url=(b.file_url||'');const nm=b.name;
  const mt=b.style+' · '+b.bpm+' BPM';

  return`<div class="beat-card${playingId===b.id?' playing':''}${b.exclusive?' exclusive':''}${b.archived?' archived':''}">
    ${coverHTML}
    <div class="beat-body">
      <div class="wave">${waveHTML(playingId===b.id)}</div>
      <div class="beat-name">${b.name}</div>
      <div class="beat-tags">
        <span class="tag t-bpm">${b.bpm} bpm</span>
        <span class="tag t-style">${b.style}</span>
        ${b.scale?`<span class="tag t-scale">${b.scale}</span>`:''}
        <span class="tag t-mood">${b.mood}</span>
        ${b.exclusive?`<span class="tag t-excl">exclusivo</span>`:''}

        ${b.album_id?`<span class="tag" style="background:var(--bg3);color:var(--text3)">📁 ${(albums.find(a=>a.id===b.album_id)||{}).name||''}</span>`:''}
      </div>

        </button>
        <div class="beat-actions">
          <button class="icon-btn fav${isFav?' on':''}" data-id="${b.id}" onclick="toggleFav(this.dataset.id)" title="Favoritar"><i class="ti ${isFav?'ti-heart-filled':'ti-heart'}"></i></button>

          ${b.file_url?`<button class="icon-btn" data-url="${b.file_url}" data-name="${b.name}" onclick="downloadBeat(this.dataset.url,this.dataset.name)" title="Download"><i class="ti ti-download"></i></button>`:''}
          ${isP?`<button class="icon-btn" data-id="${b.id}" onclick="showEditBeat(this.dataset.id)" title="Editar"><i class="ti ti-edit"></i></button>`:''}
          ${isMaster()?`<button class="icon-btn" data-id="${b.id}" data-arch="${b.archived}" onclick="toggleArchive(this.dataset.id,this.dataset.arch==='true')" title="${b.archived?'Desarquivar':'Arquivar'}"><i class="ti ${b.archived?'ti-archive-off':'ti-archive'}"></i></button>`:''}
          ${isP?`<button class="icon-btn danger" data-id="${b.id}" data-name="${b.name}" onclick="confirmDelete(this.dataset.id,this.dataset.name)" title="Excluir"><i class="ti ti-trash"></i></button>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

function beatsHTML(){
  const list=getFiltered(),tot=totalSel();
  const allStyles=[...new Set(beats.filter(b=>!b.archived).map(b=>b.style))];
  const allMoods=[...new Set(beats.filter(b=>!b.archived).map(b=>b.mood))];
  const chips=(arr,type)=>arr.map(v=>`<button class="chip${SEL[type].has(v)?' on':''}" onclick="toggleChip('${type}','${v}')">${v}</button>`).join('');
  const filterBar=`<div class="filter-bar"><div class="filter-rows">
    <div class="frow"><span class="frow-label">Estilo</span><div class="chips">${chips(allStyles,'style')}</div></div>
    <div class="frow"><span class="frow-label">Mood</span><div class="chips">${chips(allMoods,'mood')}</div></div>
    <div class="frow"><span class="frow-label">BPM</span><div class="chips">${chips(BPMS,'bpm')}</div></div>
    </div><div class="filter-footer">
    <span class="filter-count">${tot>0?`<b>${tot}</b> filtro${tot>1?'s':''} ativo${tot>1?'s':''}`:'Nenhum filtro ativo'}</span>
    ${tot>0?`<button class="clear-filters" onclick="clearFilters()">Limpar todos</button>`:''}
    </div></div>`;
  const cards=list.length===0?`<div class="empty-state"><i class="ti ti-music-off"></i><p>Nenhum beat encontrado</p><small>${beats.filter(b=>!b.archived).length===0?'Adicione o primeiro beat!':'Tente outros filtros'}</small></div>`:list.map(b=>beatCardHTML(b)).join('');
  const favBeats=beats.filter(b=>favorites.has(b.id)&&!b.archived);
  const favsSection=!isProdutor()&&favBeats.length>0?`
    <div class="divider-section"><span>Beats Favoritos</span></div>
    <div class="beats-grid">${favBeats.map(b=>beatCardHTML(b)).join('')}</div>`:'';
  return filterBar+`<div class="results-bar">
    <span class="results-count"><b>${list.length}</b> de ${beats.filter(b=>!b.archived).length} beats</span>
    <select class="sort-sel" onchange="sortBeats(this.value)"><option value="date">Mais recentes</option><option value="bpm_asc">BPM crescente</option><option value="bpm_desc">BPM decrescente</option><option value="az">A – Z</option></select>
    </div><div class="beats-grid">${cards}</div>${favsSection}`;
}

function sortBeats(v){if(v==='bpm_asc')beats.sort((a,b)=>a.bpm-b.bpm);if(v==='bpm_desc')beats.sort((a,b)=>b.bpm-a.bpm);if(v==='az')beats.sort((a,b)=>a.name.localeCompare(b.name));if(v==='date')beats.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));document.getElementById('content').innerHTML=beatsHTML();}

async function saveEditBeat(){
  const name=document.getElementById('ed-name').value.trim();
  const bpm=parseInt(document.getElementById('ed-bpm').value);
  const style=document.getElementById('ed-style').value;
  const scale=document.getElementById('ed-scale').value;
  const album_id=document.getElementById('ed-album').value||null;
  const exclusive=document.getElementById('ed-excl').checked;
  const moodEl=document.querySelector('#modal-box .mood-opt.on');
  const mood=moodEl?moodEl.textContent:null;
  if(!name||!bpm||!style){showToast('Preencha os campos obrigatórios.','error');return;}
  try{
    const patch={name,bpm,style,scale:scale||null,exclusive,album_id};
    if(mood)patch.mood=mood;
    await sb('/rest/v1/beats?id=eq.'+editingBeat,{method:'PATCH',body:JSON.stringify(patch)});
    const b=beats.find(x=>x.id===editingBeat);if(b)Object.assign(b,patch);
    if(exclusive){
      const checkboxes=document.querySelectorAll('#excl-artists input[type=checkbox]');
      const selectedIds=[...checkboxes].filter(c=>c.checked).map(c=>c.value);
      await sb('/rest/v1/beat_access?beat_id=eq.'+editingBeat,{method:'DELETE'});
      if(selectedIds.length>0){
        await sb('/rest/v1/beat_access',{method:'POST',body:JSON.stringify(selectedIds.map(uid=>({beat_id:editingBeat,user_id:uid})))});
      }
      beatAccess[editingBeat]=selectedIds;
    }else{
      await sb('/rest/v1/beat_access?beat_id=eq.'+editingBeat,{method:'DELETE'});
      beatAccess[editingBeat]=[];
    }
    closeModal();renderContent();showToast('Beat atualizado!','success');
  }catch(e){showToast('Erro ao salvar.','error');}
}

      </div>
      <div class="beat-detail-actions">
        <button class="btn btn-primary" data-url="${b.file_url||''}" data-name="${b.name}" data-meta="${b.style+' · '+b.bpm+' BPM'}" data-cover="${b.cover_url||''}" data-id="${b.id}" onclick="playBeatBtn(this)"><i class="ti ti-player-play"></i>Ouvir</button>
        ${b.file_url?`<button class="btn" data-url="${b.file_url}" data-name="${b.name}" onclick="downloadBeat(this.dataset.url,this.dataset.name)"><i class="ti ti-download"></i>Download</button>`:''}
        <button class="btn${isFav?' btn-primary':''}" data-id="${b.id}" onclick="toggleFav(this.dataset.id);closeModal()"><i class="ti ${isFav?'ti-heart-filled':'ti-heart'}"></i>${isFav?'Salvo':'Favoritar'}</button>
      </div>
    </div>
  </div>
  <div class="section-title">Comentários</div>
  <div class="comments-list" id="comments-list">${commHTML}</div>
  <div class="comment-input-wrap">
    <textarea class="comment-input" id="comment-input" rows="2" placeholder="Escreva um comentário..."></textarea>
    <button class="btn btn-primary" data-id="${beatId}" onclick="sendComment(this.dataset.id)"><i class="ti ti-send"></i></button>
  </div>
  <div style="margin-top:20px"></div>
  <div class="section-title">Minha Letra</div>
  <textarea class="lyrics-area" id="lyrics-area" placeholder="Escreva sua letra aqui...">${lyric?lyric.content:''}</textarea>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn btn-primary" data-id="${beatId}" onclick="saveLyrics(this.dataset.id)"><i class="ti ti-check"></i>Salvar letra</button>
  </div>`);
  logActivity('login',null,null);
}

async function sendComment(beatId){
  const text=document.getElementById('comment-input').value.trim();if(!text)return;
  try{
    const res=await sb('/rest/v1/comments',{method:'POST',body:JSON.stringify({user_id:currentUser.id,beat_id:beatId,user_name:currentProfile.name,text,is_master:isMaster()})});
    const c=res[0];
    document.getElementById('comments-list').innerHTML+=`<div class="comment-card"><div class="comment-header"><span class="comment-author${isMaster()?' master':''}">${isMaster()?'👑 ':''} ${c.user_name}</span><span class="comment-date">agora</span></div><div class="comment-text">${c.text}</div></div>`;
    document.getElementById('comment-input').value='';
    showToast('Comentário enviado!','success');
    logActivity('comment',beatId,beats.find(b=>b.id===beatId)?.name);
  }catch(e){showToast('Erro.','error');}
}

async function saveLyrics(beatId){
  const content=document.getElementById('lyrics-area').value.trim();
  if(!content){showToast('Escreva algo antes de salvar.','error');return;}
  try{
    const existing=await sb(`/rest/v1/lyrics?beat_id=eq.${beatId}&user_id=eq.${currentUser.id}`);
    if(existing.length>0)await sb(`/rest/v1/lyrics?id=eq.${existing[0].id}`,{method:'PATCH',body:JSON.stringify({content,updated_at:new Date().toISOString()})});
    else await sb('/rest/v1/lyrics',{method:'POST',body:JSON.stringify({user_id:currentUser.id,beat_id:beatId,user_name:currentProfile.name,content})});
    showToast('Letra salva!','success');
    logActivity('lyrics',beatId,beats.find(b=>b.id===beatId)?.name);
  }catch(e){showToast('Erro.','error');}
}

      <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" accept=".mp3,.wav,.flac,.aiff" style="display:none"/>
        <i class="ti ti-cloud-upload"></i>
        <div class="upload-txt" id="upload-txt">Arraste ou clique para selecionar</div>
        <div class="upload-sub">MP3 · WAV · FLAC · AIFF — até 50 MB</div>
      </div>
    </div>
    <div class="form-section"><div class="form-section-title">Capa (opcional)</div>
      <div class="cover-upload" onclick="document.getElementById('cover-input').click()">
        <input type="file" id="cover-input" accept="image/*" style="display:none"/>
        <div class="cover-preview" id="cover-preview"><i class="ti ti-photo"></i></div>
        <div><div style="font-size:13px;color:var(--text2)">Adicionar imagem de capa</div><div style="font-size:11px;color:var(--text3);margin-top:3px">JPG · PNG · WEBP</div></div>
      </div>
    </div>
    <div class="form-section"><div class="form-section-title">Informações do Beat</div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Nome do beat *</label><input class="form-input" id="f-name" placeholder="Ex: Noite de Verão"/></div>
        <div class="form-group"><label class="form-label">BPM *</label><input class="form-input" id="f-bpm" type="number" min="40" max="300" placeholder="Ex: 140"/></div>
        <div class="form-group"><label class="form-label">Estilo *</label><select class="form-input" id="f-style"><option value="">Selecione...</option>${STYLES.map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Escala musical</label><select class="form-input" id="f-scale"><option value="">Selecione...</option>${SCALES.map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Álbum</label><select class="form-input" id="f-album"><option value="">Sem álbum</option>${albums.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Exclusivo 🔒</label><select class="form-input" id="f-excl"><option value="false">Não</option><option value="true">Sim</option></select></div>
      </div>
    </div>
    <div class="form-section"><div class="form-section-title">Mood / Sentimento *</div>
      <div class="mood-grid">${MOODS.map(m=>`<button class="mood-opt" onclick="selMood('${m}',this)">${m}</button>`).join('')}</div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveBeat()"><i class="ti ti-check"></i>Salvar beat</button>
      <button class="btn" onclick="goTo('beats')">Cancelar</button>
    </div>
  </div>`;
}

function bindUpload(){
  selectedFile=null;selectedCover=null;selectedMood='';
  document.getElementById('file-input').addEventListener('change',function(){
    const f=this.files[0];if(!f)return;selectedFile=f;
    document.getElementById('upload-zone').classList.add('has-file');
    document.getElementById('upload-txt').textContent='✓ '+f.name;
  });
  document.getElementById('cover-input').addEventListener('change',function(){
    const f=this.files[0];if(!f)return;selectedCover=f;
    const reader=new FileReader();
    reader.onload=e=>{document.getElementById('cover-preview').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:8px"/>`;};
    reader.readAsDataURL(f);
  });
}

function selMood(m,el){selectedMood=m;document.querySelectorAll('.mood-opt').forEach(b=>b.classList.remove('on'));el.classList.add('on');}

async function saveBeat(){
  const name=document.getElementById('f-name').value.trim();
  const bpm=parseInt(document.getElementById('f-bpm').value);
  const style=document.getElementById('f-style').value;
  const scale=document.getElementById('f-scale').value;
  const album_id=document.getElementById('f-album').value||null;
  const exclusive=document.getElementById('f-excl').value==='true';
  if(!name){showToast('Informe o nome.','error');return;}
  if(!bpm||bpm<40){showToast('BPM inválido.','error');return;}
  if(!style){showToast('Selecione o estilo.','error');return;}
  if(!selectedMood){showToast('Selecione o mood.','error');return;}
  if(!selectedFile){showToast('Selecione um arquivo de áudio.','error');return;}
  document.getElementById('progress-upload').style.display='flex';
  document.querySelector('.form-actions').style.opacity='.5';
  document.querySelector('.form-actions').style.pointerEvents='none';
  try{
    const file_url=await uploadFile(selectedFile,'beats');
    let cover_url=null;if(selectedCover)cover_url=await uploadFile(selectedCover,'beats');
    const res=await sb('/rest/v1/beats',{method:'POST',body:JSON.stringify({name,bpm,style,scale:scale||null,mood:selectedMood,file_url,cover_url,file_name:selectedFile.name,album_id,exclusive,archived:false})});
    beats.unshift(res[0]);
    logActivity('beat_added',res[0].id,name);
    showToast('Beat salvo!','success');goTo('beats');
  }catch(e){
    showToast('Erro: '+e.message,'error');
    document.getElementById('progress-upload').style.display='none';
    document.querySelector('.form-actions').style.opacity='1';
    document.querySelector('.form-actions').style.pointerEvents='auto';
  }
}

// ── MEMBERS ────────────────────────────────────────────
function membersHTML(){
  const colors=[['#1a1830','#a89cf7'],['#0d2a1a','#4ade80'],['#2a1f0a','#fbbf24'],['#1a1a2e','#8888cc'],['#1a0d0d','#f87171']];
  const roleLabel=r=>r==='master'?'👑 Mestre':r==='produtor'?'Produtor':'Artista';
  const roleClass=r=>r==='master'?'status-master':r==='produtor'?'status-produtor':'status-artista';
  const cards=profiles.map((m,i)=>{
    const[bg,tc]=colors[i%colors.length];
    const ini=m.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const badgeClass=m.active===false?'status-inactive':roleClass(m.role);
    const badgeTxt=m.active===false?'Inativo':roleLabel(m.role);
    return '<div class="member-card">'+
      '<div class="member-info">'+
      '<div class="member-av" style="background:'+bg+';color:'+tc+'">'+ini+'</div>'+
      '<div><div class="member-name">'+m.name+'</div><div class="member-role-txt">'+roleLabel(m.role)+'</div></div>'+
      '</div>'+
      '<div class="member-right">'+
      '<span class="status-badge '+badgeClass+'">'+badgeTxt+'</span>'+
      '</div></div>';
  }).join('');
  const empty=profiles.length===0?'<div class="empty-state"><i class="ti ti-users"></i><p>Nenhum membro ainda</p></div>':'';
  return'<div class="members-list">'+cards+empty+'</div>';
}

async function changeRole(id,role){
  try{await sb(`/rest/v1/profiles?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({role})});const p=profiles.find(x=>x.id===id);if(p)p.role=role;showToast('Papel atualizado!','success');renderContent();}
  catch(e){showToast('Erro.','error');}
}
async function toggleActive(id,currentlyActive){
  try{
    await sb(`/rest/v1/profiles?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({active:!currentlyActive})});
    const p=profiles.find(x=>x.id===id);if(p)p.active=!currentlyActive;
    showToast(currentlyActive?'Artista bloqueado.':'Artista ativado.','success');renderContent();
  }catch(e){showToast('Erro.','error');}
}

// ── AUDIO ──────────────────────────────────────────────
const audio=document.getElementById('audio-el');let rafId=null;

function playBeatBtn(btn){
  const{url,name,meta,cover,id}=btn.dataset;
  if(playingId===id){toggleAudio();return;}
  stopAudio();if(!url){showToast('Sem arquivo de áudio.','error');return;}
  playingId=id;audio.src=url;
  audio.play().catch(()=>showToast('Erro ao reproduzir.','error'));
  document.getElementById('p-name').textContent=name;
  document.getElementById('p-meta').textContent=meta;
  document.getElementById('p-cover').innerHTML=cover?`<img src="${cover}" style="width:100%;height:100%;object-fit:cover"/>`:'<i class="ti ti-music"></i>';
  document.getElementById('player-bar').classList.remove('hidden');
  document.getElementById('p-playbtn').innerHTML='<i class="ti ti-player-pause"></i>';
  startProgress();renderContent();
  logActivity('download',id,name);
}
function toggleAudio(){if(audio.paused){audio.play();document.getElementById('p-playbtn').innerHTML='<i class="ti ti-player-pause"></i>';startProgress();}else{audio.pause();document.getElementById('p-playbtn').innerHTML='<i class="ti ti-player-play"></i>';cancelAnimationFrame(rafId);}}
function stopAudio(){audio.pause();audio.src='';playingId=null;cancelAnimationFrame(rafId);document.getElementById('player-bar').classList.add('hidden');}
function startProgress(){function tick(){updateProgress();rafId=requestAnimationFrame(tick);}cancelAnimationFrame(rafId);rafId=requestAnimationFrame(tick);}
function updateProgress(){if(!audio.duration)return;document.getElementById('p-fill').style.width=(audio.currentTime/audio.duration*100)+'%';document.getElementById('p-cur').textContent=fmt(audio.currentTime);document.getElementById('p-dur').textContent=fmt(audio.duration);}
function fmt(s){const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}
function seekRel(d){audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+d));}
function seekClick(e){const r=document.getElementById('p-bar').getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;}
function setVol(v){audio.volume=v;}
audio.addEventListener('ended',()=>{cancelAnimationFrame(rafId);document.getElementById('p-playbtn').innerHTML='<i class="ti ti-player-play"></i>';document.getElementById('p-fill').style.width='0%';});

// ── DOWNLOAD ───────────────────────────────────────────
async function downloadBeat(url,name){
  try{
    showToast('Baixando...','success');
    const r=await fetch(url);const blob=await r.blob();
    const ext=url.split('.').pop().split('?')[0]||'mp3';
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.'+ext;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
  }catch(e){showToast('Erro ao baixar.','error');}
}

// ── MODAL / TOAST ──────────────────────────────────────
function showModal(html){document.getElementById('modal-box').innerHTML=html;document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
let toastT;
function showToast(msg,type='success'){const t=document.getElementById('toast');t.innerHTML=`<i class="ti ${type==='success'?'ti-circle-check':'ti-alert-circle'}"></i>${msg}`;t.className=`toast ${type} show`;clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);}

// ── INIT ───────────────────────────────────────────────
window.addEventListener('load',async()=>{
  const token=localStorage.getItem('sb_token');const refresh=localStorage.getItem('sb_refresh');
  if(token&&refresh){
    try{
      const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});
      if(r.ok){const d=await r.json();accessToken=d.access_token;currentUser=d.user;localStorage.setItem('sb_token',d.access_token);localStorage.setItem('sb_refresh',d.refresh_token);await loadProfile();hideLoading();await initApp();return;}
    }catch(e){}
    localStorage.removeItem('sb_token');localStorage.removeItem('sb_refresh');
  }
  hideLoading();document.getElementById('auth').classList.remove('hidden');showView('login');
});
</script>
